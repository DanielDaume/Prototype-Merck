name: ai-agent-central

services:
  app:
    build: .
    ports:
      - "3002:3000"
    volumes:
      - ai-agent-central_data:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "file:/app/data/dev.db"
    restart: unless-stopped

volumes:
  ai-agent-central_data:
